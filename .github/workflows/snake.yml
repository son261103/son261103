name: Generate profile assets

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: son261103
          outputs: dist/snake.svg

      - name: Generate 3D contrib
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: son261103

      - name: Publish to output branch
        run: |
          echo "=== generated files ==="
          ls -la dist/ profile-3d-contrib/ profile-3d/ 2>/dev/null || true
          mkdir -p /tmp/assets
          cp dist/snake.svg /tmp/assets/ 2>/dev/null || echo "WARN: no snake.svg"
          if ls profile-3d-contrib/*.svg >/dev/null 2>&1; then
            cp profile-3d-contrib/profile-green-animate.svg /tmp/assets/ 2>/dev/null || true
            cp profile-3d-contrib/profile-green.svg /tmp/assets/ 2>/dev/null || true
          else
            echo "WARN: no 3d svgs, keeping old non-empty ones"
            git fetch origin output || true
            if git show-ref --verify --quiet refs/remotes/origin/output; then
              SZ=$(git cat-file -s origin/output:profile-green-animate.svg 2>/dev/null || echo 0)
              if [ "$SZ" -gt 1000 ] 2>/dev/null; then git show origin/output:profile-green-animate.svg > /tmp/assets/profile-green-animate.svg; fi
              SZ=$(git cat-file -s origin/output:profile-green.svg 2>/dev/null || echo 0)
              if [ "$SZ" -gt 1000 ] 2>/dev/null; then git show origin/output:profile-green.svg > /tmp/assets/profile-green.svg; fi
            fi
          fi
          git fetch origin output || true
          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git checkout output
          else
            git checkout --orphan output
          fi
          git rm -rf . --ignore-unmatch
          cp /tmp/assets/*.svg ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.svg
          git diff --staged --quiet || git commit -m "chore: update profile assets"
          git push origin output
